    <circle class="nd" cx="850" cy="175" r="4.5" style="animation-delay:3s" filter="url(#gl)"/>
    <circle class="nd" cx="760" cy="140" r="3.5" style="animation-delay:1.2s" filter="url(#gl)"/>
  </g>

