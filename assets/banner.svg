<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="t d">
  <title id="t">Ace (@acedev0): Streaming · AI · Formal Verification</title>
  <desc id="d">A dark cinematic banner with animated byte-stream bars, a neural network node constellation, and a pulsing verification checkmark — representing streaming infrastructure, AI/LLM integration, and formal proofs.</desc>
  <style>
    .nm{font-family:"Avenir Next","Segoe UI Variable Display","Segoe UI","SF Pro Display",system-ui,"Helvetica Neue",Arial,sans-serif;font-size:64px;font-weight:800;letter-spacing:-2px;fill:#e8f0fa}
    .tg{font-family:"Avenir Next","Segoe UI Variable Text","Segoe UI","SF Pro Text",system-ui,"Helvetica Neue",Arial,sans-serif;font-size:19px;font-weight:500;fill:#8aa0ba}
    .cp{font-family:"JetBrains Mono","Fira Code","Cascadia Code","SF Mono",Menlo,Consolas,monospace;font-size:11.5px}
    .pill{font-family:"Avenir Next","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;font-size:12px;font-weight:600;letter-spacing:.5px}
    .c{fill:#17283f;animation:pass 12s linear infinite backwards}
    @keyframes pass{0%{fill:#17283f}1%{fill:#a78bfa}3%{fill:#a78bfa}4%{fill:#58a6ff}10%{fill:#58a6ff}14%{fill:#17283f}100%{fill:#17283f}}
    .nd{fill:#1e3a5f;animation:glow 4s ease-in-out infinite alternate}
    @keyframes glow{0%{fill:#1e3a5f;opacity:.4}50%{fill:#6366f1;opacity:.9}100%{fill:#1e3a5f;opacity:.4}}
    .ln{stroke:#2d4a6f;stroke-width:.6;animation:fade 5s ease-in-out infinite alternate;opacity:.3}
    @keyframes fade{0%{opacity:.15}50%{opacity:.5}100%{opacity:.15}}
    .vk{animation:pulse 3s ease-in-out infinite}
    @keyframes pulse{0%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}100%{opacity:.6;transform:scale(1)}}
    .orbit{animation:spin 30s linear infinite;transform-origin:820px 130px}
    @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.c,.nd,.ln,.vk,.orbit{animation:none}.nd{fill:#2a4a6f;opacity:.6}.vk{opacity:.85}}
  </style>
  <defs>
    <radialGradient id="bg1" cx="200" cy="100" r="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1040" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#0c1624" stop-opacity="1"/>
      <stop offset="1" stop-color="#0a0f1a" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="bg2" cx="820" cy="140" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b2d5f" stop-opacity=".35"/>
      <stop offset="1" stop-color="#0c1624" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bdr" x1="0" y1="0" x2="1000" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".5"/>
      <stop offset=".35" stop-color="#1f3350" stop-opacity=".4"/>
      <stop offset=".65" stop-color="#22d3ee" stop-opacity=".3"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="chk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1000" height="320" rx="16"/></clipPath>
    <filter id="gl" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background layers -->
  <g clip-path="url(#frame)">
    <rect width="1000" height="320" fill="#0a0f1a"/>
    <rect width="1000" height="320" fill="url(#bg1)"/>
    <rect width="1000" height="320" fill="url(#bg2)"/>

    <!-- Subtle grid pattern -->
    <g opacity=".04" stroke="#58a6ff" stroke-width=".5">
      <line x1="0" y1="40" x2="1000" y2="40"/><line x1="0" y1="80" x2="1000" y2="80"/>
      <line x1="0" y1="120" x2="1000" y2="120"/><line x1="0" y1="160" x2="1000" y2="160"/>
      <line x1="0" y1="200" x2="1000" y2="200"/><line x1="0" y1="240" x2="1000" y2="240"/>
      <line x1="0" y1="280" x2="1000" y2="280"/>
      <line x1="100" y1="0" x2="100" y2="320"/><line x1="200" y1="0" x2="200" y2="320"/>
      <line x1="300" y1="0" x2="300" y2="320"/><line x1="400" y1="0" x2="400" y2="320"/>
      <line x1="500" y1="0" x2="500" y2="320"/><line x1="600" y1="0" x2="600" y2="320"/>
      <line x1="700" y1="0" x2="700" y2="320"/><line x1="800" y1="0" x2="800" y2="320"/>
      <line x1="900" y1="0" x2="900" y2="320"/>
    </g>
  </g>

  <!-- Neural network constellation (right side) -->
  <g opacity=".7">
    <!-- Connection lines -->
    <line class="ln" x1="740" y1="55" x2="800" y2="95" style="animation-delay:0s"/>
    <line class="ln" x1="740" y1="55" x2="860" y2="70" style="animation-delay:.8s"/>
    <line class="ln" x1="800" y1="95" x2="860" y2="70" style="animation-delay:.4s"/>
    <line class="ln" x1="800" y1="95" x2="880" y2="130" style="animation-delay:1.2s"/>
    <line class="ln" x1="860" y1="70" x2="920" y2="105" style="animation-delay:.6s"/>
