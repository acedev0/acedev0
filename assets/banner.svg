    <circle cx="0" cy="0" r="14" fill="none" stroke="url(#chk)" stroke-width="1.5" opacity=".7"/>
    <path d="M-6,0 L-2,5 L7,-5" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
